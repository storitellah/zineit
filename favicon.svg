<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ZineIt — a Z opening like a book">
  <rect width="64" height="64" rx="14" fill="#1A1A1A"/>
  <!-- open-book pages fanning from a centre spine, forming the Z's diagonal sweep -->
  <path d="M12 17 L32 21 L32 47 L12 45 Z" fill="#F6D76B"/>
  <path d="M52 17 L32 21 L32 47 L52 45 Z" fill="#B63A2B"/>
  <line x1="32" y1="21" x2="32" y2="47" stroke="#1A1A1A" stroke-width="2"/>
  <!-- the Z, drawn boldly over the open book -->
  <path d="M20 20 H44 V26 L28 42 H45 V48 H19 V42 L35 26 H20 Z" fill="#F7F7F5"/>
</svg>